# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: bundler
    directory: '/builder'
    schedule:
      interval: daily
      time: '01:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: lockfile-only
    # No cooldown, so new gem versions arrive the next day
    cooldown:
      exclude:
        - '*'
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    labels:
      - 'dependencies'
      - 'ruby'
    groups:
      rails:
        patterns:
          - 'actioncable'
          - 'actionmailbox'
          - 'actionmailer'
          - 'actionpack'
          - 'actiontext'
          - 'actionview'
          - 'activejob'
          - 'activemodel'
          - 'activerecord'
          - 'activestorage'
          - 'activesupport'
          - 'rails'
          - 'railties'
          - 'globalid'
          - 'i18n'
          - 'mail'
          - 'rack'
          - 'rackup'
      turbo:
        patterns:
          - 'turbo-rails'
          - 'stimulus-rails'

  # Only digest updates: the Ruby version is also set in builder/Gemfile and
  # .ruby-version, so version bumps stay a manual change.
  # Every day and without cooldown, so a rebuilt base image arrives quickly
  # ("daily" skips weekends, and the default cooldown is 3 days).
  - package-ecosystem: 'docker'
    directories:
      - '/builder'
      - '/final'
    schedule:
      interval: 'cron'
      cronjob: '0 6 * * *'
      timezone: Europe/Berlin
    cooldown:
      exclude:
        - 'ruby'
    ignore:
      - dependency-name: 'ruby'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    labels:
      - 'dependencies'
      - 'docker'
    groups:
      base-image:
        group-by: dependency-name

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '01:00'
      timezone: Europe/Berlin
    labels:
      - 'dependencies'
      - 'gh-action'
